name: Waqt APK
on:
  push:
    branches: [waqt-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK
        working-directory: waqt-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK exists
        run: test -s waqt-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Waqt-Android-Widget-APK
          path: waqt-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
